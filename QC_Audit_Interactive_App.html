<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QC Feedback & Audit Dashboard</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Word Document Exporter Library -->
  <script src="https://cdn.jsdelivr.net/npm/html-docx-js-version-updated@0.4.0/dist/html-docx.min.js"></script>
  <!-- FileSaver Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

    .editable-cell {
      min-height: 2rem;
      transition: all 0.15s ease;
      word-break: break-word;
      overflow-wrap: anywhere;
    }
    .editable-cell:hover {
      background-color: #f8fafc;
      outline: 1px dashed #cbd5e1;
      border-radius: 4px;
    }
    .editable-cell:focus {
      background-color: #ffffff;
      outline: 2px solid #ea580c !important;
      border-radius: 4px;
    }

    /* Print & PDF Export Rules */
    @page {
      size: landscape;
      margin: 8mm;
    }
    @media print {
      .no-print { display: none !important; }
      body { background: white !important; color: black !important; padding: 0 !important; }
      .container-main { max-width: 100% !important; padding: 0 !important; margin: 0 !important; }
      table { border-collapse: collapse !important; width: 100% !important; table-layout: auto !important; }
      th, td { border: 1px solid #cbd5e1 !important; padding: 6px !important; word-break: break-word !important; }
      .editable-cell { outline: none !important; white-space: normal !important; }
      .img-thumbnail { max-height: 140px !important; width: auto !important; }
    }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans min-h-screen pb-12">

  <!-- Header Toolbar -->
  <header class="bg-slate-900 text-white shadow-md sticky top-0 z-30 no-print">
    <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
      <div class="flex items-center space-x-3">
        <div class="bg-orange-600 text-white p-2 rounded-lg font-bold">
          <i class="fa-solid fa-list-check text-xl"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg leading-tight">QC Audit Report Generator</h1>
          <p class="text-xs text-slate-400">Interactive Document & Screenshot Tracker</p>
        </div>
      </div>

      <!-- Quick Action Buttons -->
      <div class="flex items-center space-x-2 flex-wrap gap-y-2">
        <button onclick="addNewRow()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold px-3 py-2 rounded-md transition flex items-center gap-1.5">
          <i class="fa-solid fa-plus"></i> Add Row
        </button>
        <button onclick="exportToWord()" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-semibold px-3 py-2 rounded-md transition flex items-center gap-1.5">
          <i class="fa-solid fa-file-word"></i> Export Word (.docx)
        </button>
        <button onclick="exportToHTML()" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold px-3 py-2 rounded-md transition flex items-center gap-1.5">
          <i class="fa-solid fa-code"></i> Export HTML
        </button>
        <button onclick="window.print()" class="bg-slate-700 hover:bg-slate-600 text-white text-xs font-semibold px-3 py-2 rounded-md transition flex items-center gap-1.5">
          <i class="fa-solid fa-print"></i> Print / PDF
        </button>
        <button onclick="clearAllData()" class="bg-rose-700 hover:bg-rose-800 text-white text-xs font-semibold px-2.5 py-2 rounded-md transition" title="Clear All Data">
          <i class="fa-solid fa-trash-can"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Container -->
  <main class="max-w-7xl mx-auto px-4 pt-6 container-main">
    
    <!-- Title Banner -->
    <div class="bg-orange-600 text-white rounded-t-lg p-4 font-semibold text-2xl shadow-sm flex justify-between items-center">
      <span contenteditable="true" class="outline-none focus:border-b-2 border-white px-1" id="reportTitle">Feedback to dev</span>
      <span class="text-xs bg-orange-700/60 px-3 py-1 rounded text-orange-100 font-normal no-print">Click text to edit title</span>
    </div>

    <!-- Data Table Container -->
    <div class="bg-white rounded-b-lg shadow-md overflow-x-auto border-x border-b border-slate-200">
      <table class="w-full text-left border-collapse min-w-[1000px]">
        <thead>
          <tr class="bg-orange-500 text-white text-xs uppercase font-bold tracking-wider border-b border-orange-600">
            <th class="p-2 w-10 text-center border-r border-orange-400">#</th>
            <th class="p-2 w-28 border-r border-orange-400">Page Name</th>
            <th class="p-2 w-48 border-r border-orange-400">Page URL</th>
            <th class="p-2 w-24 border-r border-orange-400">Status</th>
            <th class="p-2 w-24 border-r border-orange-400">Action To</th>
            <th class="p-2 w-28 border-r border-orange-400">Element</th>
            <th class="p-2 border-r border-orange-400" style="min-width: 220px;">Description</th>
            <th class="p-2 w-72 text-center">Description Image</th>
            <th class="p-2 w-8 text-center no-print"></th>
          </tr>
        </thead>
        <tbody id="qcTableBody" class="divide-y divide-slate-200 text-sm">
          <!-- Dynamic Rows -->
        </tbody>
      </table>
    </div>

    <!-- Memory Indicator -->
    <div class="mt-4 flex justify-between items-center text-xs text-slate-500 no-print">
      <div class="flex items-center gap-2">
        <i class="fa-solid fa-hard-drive"></i>
        <span>Browser Storage: <strong id="storageUsage">0 KB</strong> / ~5000 KB</span>
      </div>
      <div class="text-slate-400">
        Tip: Paste screenshots directly into image cells using <kbd class="bg-slate-200 px-1 rounded text-slate-700">Ctrl+V</kbd> or <kbd class="bg-slate-200 px-1 rounded text-slate-700">Cmd+V</kbd>.
      </div>
    </div>
  </main>

  <!-- Image Lightbox Modal -->
  <div id="imageModal" class="fixed inset-0 bg-black/80 z-50 hidden flex-col items-center justify-center p-4 no-print" onclick="closeModal(event)">
    <div class="relative max-w-5xl max-h-[90vh] flex flex-col items-center" onclick="event.stopPropagation()">
      <div class="absolute -top-10 right-0 flex gap-4 text-white">
        <button onclick="closeModal()" class="hover:text-orange-400 text-xl font-bold"><i class="fa-solid fa-xmark"></i> Close</button>
      </div>
      <img id="modalImg" src="" class="max-h-[80vh] max-w-full rounded shadow-2xl object-contain bg-white">
      <div id="modalCaption" class="mt-3 text-white text-sm bg-slate-800/80 px-4 py-2 rounded max-w-full text-center"></div>
    </div>
  </div>

  <!-- JavaScript Logic -->
  <script>
    // Grammatically correct default text values
    let reportData = [
      {
        pageName: "Home",
        pageUrl: "https://www.matrixinternet.ie/",
        status: "To Do",
        actionTo: "Frontend",
        element: "Header",
        description: "Change paddings to match the design",
        images: ["https://picsum.photos/400/250?random=1"]
      },
      {
        pageName: "Blog",
        pageUrl: "https://www.matrixinternet.ie/blog/",
        status: "To Do",
        actionTo: "Backend",
        element: "Search",
        description: "Tests are required",
        images: ["https://picsum.photos/400/250?random=2"]
      }
    ];

    const STATUS_OPTIONS = [
      { label: "To Do", bg: "bg-slate-200", text: "text-slate-700" },
      { label: "In Review", bg: "bg-sky-100", text: "text-sky-800" },
      { label: "Done", bg: "bg-emerald-100", text: "text-emerald-800" },
      { label: "Waiting for", bg: "bg-rose-100", text: "text-rose-800" }
    ];

    let ACTION_OPTIONS = ["Frontend", "Backend", "QC"];

    document.addEventListener("DOMContentLoaded", () => {
      const saved = localStorage.getItem("qc_report_data_v10");
      if (saved) {
        try { reportData = JSON.parse(saved); } catch(e){}
      }
      renderTable();
      updateStorageMeter();
    });

    function saveData() {
      localStorage.setItem("qc_report_data_v10", JSON.stringify(reportData));
      updateStorageMeter();
    }

    function renderTable() {
      const tbody = document.getElementById("qcTableBody");
      tbody.innerHTML = "";

      reportData.forEach((item, index) => {
        const tr = document.createElement("tr");
        tr.className = "hover:bg-slate-50/80 transition border-b border-slate-200";

        let statusOptionsHtml = STATUS_OPTIONS.map(opt => `
          <option value="${opt.label}" ${item.status === opt.label ? 'selected' : ''}>${opt.label}</option>
        `).join("");

        const currentStatus = STATUS_OPTIONS.find(s => s.label === item.status) || STATUS_OPTIONS[0];

        if (item.actionTo && !ACTION_OPTIONS.includes(item.actionTo)) {
          ACTION_OPTIONS.push(item.actionTo);
        }

        let actionOptionsHtml = ACTION_OPTIONS.map(act => `
          <option value="${act}" ${item.actionTo === act ? 'selected' : ''}>${act}</option>
        `).join("");

        let imagesHtml = (item.images || []).map((imgUrl, imgIdx) => `
          <div class="relative group/img inline-block m-1">
            <img src="${imgUrl}" onclick="openModal('${imgUrl}', '${escapeHtml(item.element || '')}')" 
                 class="h-20 w-32 object-cover rounded border border-slate-300 shadow-sm cursor-zoom-in hover:opacity-90 transition img-thumbnail">
            <button onclick="removeImage(${index}, ${imgIdx})" 
                    class="no-print absolute -top-2 -right-2 bg-rose-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs opacity-0 group-hover/img:opacity-100 transition shadow">
              &times;
            </button>
          </div>
        `).join("");

        tr.innerHTML = `
          <td class="p-2 text-center text-slate-400 font-mono text-xs border-r border-slate-200">${index + 1}</td>
          
          <td class="p-1.5 border-r border-slate-200">
            <div contenteditable="true" onblur="updateField(${index}, 'pageName', this.innerText)" 
                 class="editable-cell p-1 rounded font-medium text-slate-800 text-xs outline-none">${item.pageName || ''}</div>
          </td>

          <td class="p-1.5 border-r border-slate-200">
            <div contenteditable="true" onblur="updateField(${index}, 'pageUrl', this.innerText)" 
                 class="editable-cell p-1 rounded text-blue-600 underline text-xs outline-none">${item.pageUrl || ''}</div>
          </td>

          <td class="p-1 border-r border-slate-200">
            <select onchange="updateField(${index}, 'status', this.value); renderTable();" 
                    class="text-[11px] font-semibold px-1 py-1 rounded-full border-none outline-none cursor-pointer w-full ${currentStatus.bg} ${currentStatus.text}">
              ${statusOptionsHtml}
            </select>
          </td>

          <td class="p-1 border-r border-slate-200">
            <select onchange="handleActionToChange(${index}, this.value)" 
                    class="text-[11px] font-medium px-1 py-1 rounded bg-amber-100 text-amber-800 border-none outline-none cursor-pointer w-full">
              ${actionOptionsHtml}
              <option value="__ADD_CUSTOM__">+ Custom...</option>
            </select>
          </td>

          <td class="p-1.5 border-r border-slate-200">
            <div contenteditable="true" onblur="updateField(${index}, 'element', this.innerText)" 
                 class="editable-cell p-1 rounded font-medium text-slate-700 text-xs outline-none">${item.element || ''}</div>
          </td>

          <td class="p-2 border-r border-slate-200" style="min-width: 220px;">
            <div contenteditable="true" onblur="updateField(${index}, 'description', this.innerText)" 
                 class="editable-cell p-1.5 rounded text-slate-600 text-xs leading-relaxed outline-none">${item.description || ''}</div>
          </td>

          <td class="p-2 text-center" onpaste="handlePaste(event, ${index})">
            <div class="flex flex-wrap items-center justify-center gap-1 min-h-[5rem]">
              ${imagesHtml}
              <label class="no-print border-2 border-dashed border-slate-300 hover:border-orange-500 rounded h-20 w-20 flex flex-col items-center justify-center cursor-pointer text-slate-400 hover:text-orange-500 transition">
                <i class="fa-solid fa-cloud-arrow-up text-base mb-1"></i>
                <span class="text-[10px]">Upload</span>
                <input type="file" accept="image/*" class="hidden" onchange="handleFileUpload(event, ${index})">
              </label>
            </div>
          </td>

          <td class="p-1 text-center no-print">
            <button onclick="deleteRow(${index})" class="text-slate-300 hover:text-rose-600 transition p-1" title="Delete Row">
              <i class="fa-solid fa-trash text-xs"></i>
            </button>
          </td>
        `;

        tbody.appendChild(tr);
      });
    }

    function updateField(index, key, value) {
      reportData[index][key] = value.trim();
      saveData();
    }

    function handleActionToChange(index, value) {
      if (value === "__ADD_CUSTOM__") {
        const customTag = prompt("Enter custom Action To label:");
        if (customTag && customTag.trim()) {
          const formatted = customTag.trim();
          if (!ACTION_OPTIONS.includes(formatted)) {
            ACTION_OPTIONS.push(formatted);
          }
          reportData[index].actionTo = formatted;
        }
      } else {
        reportData[index].actionTo = value;
      }
      saveData();
      renderTable();
    }

    function handlePaste(e, rowIndex) {
      const items = (e.clipboardData || e.originalEvent.clipboardData).items;
      for (let item of items) {
        if (item.type.indexOf("image") === 0) {
          const blob = item.getAsFile();
          const reader = new FileReader();
          reader.onload = (event) => {
            if (!reportData[rowIndex].images) reportData[rowIndex].images = [];
            reportData[rowIndex].images.push(event.target.result);
            saveData();
            renderTable();
          };
          reader.readAsDataURL(blob);
        }
      }
    }

    function handleFileUpload(e, rowIndex) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = (event) => {
          if (!reportData[rowIndex].images) reportData[rowIndex].images = [];
          reportData[rowIndex].images.push(event.target.result);
          saveData();
          renderTable();
        };
        reader.readAsDataURL(file);
      }
    }

    function removeImage(rowIndex, imgIndex) {
      reportData[rowIndex].images.splice(imgIndex, 1);
      saveData();
      renderTable();
    }

    function addNewRow() {
      reportData.push({
        pageName: "New Page",
        pageUrl: "https://",
        status: "To Do",
        actionTo: "Frontend",
        element: "Component",
        description: "Please describe the issue in detail here.",
        images: []
      });
      saveData();
      renderTable();
    }

    function deleteRow(index) {
      if (confirm("Are you sure you want to delete row #" + (index + 1) + "?")) {
        reportData.splice(index, 1);
        saveData();
        renderTable();
      }
    }

    function clearAllData() {
      if (confirm("Are you sure you want to clear all table rows?")) {
        reportData = [];
        saveData();
        renderTable();
      }
    }

    function openModal(src, caption) {
      document.getElementById('modalImg').src = src;
      document.getElementById('modalCaption').innerText = caption || '';
      document.getElementById('imageModal').classList.remove('hidden');
      document.getElementById('imageModal').classList.add('flex');
    }

    function closeModal(e) {
      document.getElementById('imageModal').classList.add('hidden');
      document.getElementById('imageModal').classList.remove('flex');
    }

    function escapeHtml(str) {
      return str.replace(/'/g, "\\'").replace(/"/g, '&quot;');
    }

    function updateStorageMeter() {
      const str = JSON.stringify(reportData);
      const kb = (str.length / 1024).toFixed(1);
      document.getElementById('storageUsage').innerText = kb + " KB";
    }

    // Export Word Document (.docx)
    function exportToWord() {
      const title = document.getElementById('reportTitle').innerText || 'Feedback to dev';

      const wordHtml = `<!DOCTYPE html>
<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
<head>
  <meta charset="utf-8">
  <title>${title}</title>
  <!--[if gte mso 9]>
  <xml>
    <w:WordDocument>
      <w:View>Print</w:View>
      <w:Zoom>100</w:Zoom>
      <w:DoNotOptimizeForBrowser/>
    </w:WordDocument>
  </xml>
  <![endif]-->
  <style>
    @page Section1 { size: 11in 8.5in; mso-page-orientation: landscape; margin: 0.4in; }
    div.Section1 { page: Section1; }
    body { font-family: Arial, sans-serif; font-size: 9.5pt; color: #1e293b; margin: 0; padding: 0; }
    .banner { background-color: #ea580c; color: #ffffff; padding: 8px 12px; font-size: 15pt; font-weight: bold; margin-bottom: 0px; width: 100%; box-sizing: border-box; }
    table { width: 100%; border-collapse: collapse; margin-top: 0px; table-layout: fixed; }
    th { background-color: #ea580c; color: #ffffff; padding: 6px; font-size: 8.5pt; text-transform: uppercase; font-weight: bold; border: 1px solid #c2410c; text-align: left; vertical-align: middle; }
    td { border: 1px solid #cbd5e1; padding: 6px; vertical-align: top; font-size: 9pt; word-wrap: break-word; overflow-wrap: anywhere; text-align: left; }
    .col-num { width: 3%; text-align: center; }
    .col-page { width: 10%; font-weight: bold; }
    .col-url { width: 22%; word-break: break-all; }
    .col-status { width: 8%; }
    .col-action { width: 8%; }
    .col-element { width: 10%; }
    .col-desc { width: 19%; }
    .col-img { width: 20%; text-align: left; }
    .url-link { color: #2563eb; text-decoration: underline; word-break: break-all; }
    .img-container { text-align: left; }
    img { max-width: 180px; max-height: 130px; width: auto; height: auto; margin: 4px 0; border: 1px solid #e2e8f0; display: block; }
  </style>
</head>
<body>
  <div class="Section1">
    <div class="banner">${title}</div>
    <table>
      <thead>
        <tr>
          <th class="col-num">#</th>
          <th class="col-page">PAGE NAME</th>
          <th class="col-url">PAGE URL</th>
          <th class="col-status">STATUS</th>
          <th class="col-action">ACTION TO</th>
          <th class="col-element">ELEMENT</th>
          <th class="col-desc">DESCRIPTION</th>
          <th class="col-img">SCREENSHOTS</th>
        </tr>
      </thead>
      <tbody>
        ${reportData.map((item, idx) => `
          <tr>
            <td class="col-num">${idx + 1}</td>
            <td class="col-page">${item.pageName || ''}</td>
            <td class="col-url"><a href="${item.pageUrl}" class="url-link">${item.pageUrl || ''}</a></td>
            <td class="col-status">${item.status || ''}</td>
            <td class="col-action">${item.actionTo || ''}</td>
            <td class="col-element">${item.element || ''}</td>
            <td class="col-desc">${item.description || ''}</td>
            <td class="col-img">
              <div class="img-container">
                ${(item.images || []).map(img => `<img src="${img}" />`).join('')}
              </div>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>
  </div>
</body>
</html>`;

      const converted = htmlDocx.asBlob(wordHtml, { orientation: 'landscape' });
      saveAs(converted, `qc-report-${new Date().toISOString().slice(0,10)}.docx`);
    }

    // Export Standalone Interactive HTML
    function exportToHTML() {
      const title = document.getElementById('reportTitle').innerText || 'Feedback to dev';
      const documentHtml = `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${title}</title>
  <script src="https://cdn.tailwindcss.com"><\/script>
  <style>
    .cell-text { word-break: break-word; overflow-wrap: anywhere; }
    @media print { .no-print { display: none !important; } }
  </style>
</head>
<body class="bg-slate-100 p-6 text-slate-800 font-sans">
  <div class="max-w-7xl mx-auto">
    <div class="bg-orange-600 text-white rounded-t-lg p-4 font-semibold text-2xl">${title}</div>
    <div class="bg-white rounded-b-lg shadow overflow-x-auto">
      <table class="w-full text-left border-collapse min-w-[900px]">
        <thead>
          <tr class="bg-orange-500 text-white text-xs uppercase font-bold border-b">
            <th class="p-2 w-10 text-center">#</th>
            <th class="p-2 w-28">Page Name</th>
            <th class="p-2 w-48">Page URL</th>
            <th class="p-2 w-28">Status</th>
            <th class="p-2 w-28">Action To</th>
            <th class="p-2 w-28">Element</th>
            <th class="p-2 border-r" style="min-width: 220px;">Description</th>
            <th class="p-2 w-72 text-center">Description Image</th>
          </tr>
        </thead>
        <tbody class="divide-y divide-slate-200 text-sm">
          ${reportData.map((item, idx) => {
            const statusBg = item.status === "Done" ? "bg-emerald-100 text-emerald-800" :
                             item.status === "In Review" ? "bg-sky-100 text-sky-800" :
                             item.status === "Waiting for" ? "bg-rose-100 text-rose-800" :
                             "bg-slate-200 text-slate-700";
            return `
            <tr>
              <td class="p-2 text-center text-slate-400 font-mono text-xs">${idx + 1}</td>
              <td class="p-2 font-medium text-xs cell-text">${item.pageName || ''}</td>
              <td class="p-2 cell-text"><a href="${item.pageUrl}" target="_blank" class="text-blue-600 underline text-xs">${item.pageUrl || ''}</a></td>
              <td class="p-2">
                <select onchange="updateStatusColor(this)" class="text-xs font-semibold px-2.5 py-1 rounded-full border-none outline-none cursor-pointer ${statusBg}">
                  <option value="To Do" ${item.status === 'To Do' ? 'selected' : ''}>To Do</option>
                  <option value="In Review" ${item.status === 'In Review' ? 'selected' : ''}>In Review</option>
                  <option value="Done" ${item.status === 'Done' ? 'selected' : ''}>Done</option>
                  <option value="Waiting for" ${item.status === 'Waiting for' ? 'selected' : ''}>Waiting for</option>
                </select>
              </td>
              <td class="p-2">
                <select class="text-xs font-medium px-2 py-1 rounded bg-amber-100 text-amber-800 border-none outline-none cursor-pointer">
                  ${ACTION_OPTIONS.map(act => `<option value="${act}" ${item.actionTo === act ? 'selected' : ''}>${act}</option>`).join('')}
                </select>
              </td>
              <td class="p-2 font-medium text-slate-700 text-xs cell-text">${item.element || ''}</td>
              <td class="p-2 text-xs leading-relaxed cell-text" contenteditable="true">${item.description || ''}</td>
              <td class="p-2 text-center">
                <div class="flex flex-wrap justify-center gap-1">
                  ${(item.images || []).map(img => `
                    <img src="${img}" onclick="openModal('${img}')" class="h-20 w-32 object-cover rounded border cursor-zoom-in">
                  `).join('')}
                </div>
              </td>
            </tr>
          `}).join('')}
        </tbody>
      </table>
    </div>
  </div>

  <div id="imageModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4 z-50" onclick="this.classList.add('hidden')">
    <img id="modalImg" class="max-h-[85vh] max-w-full rounded bg-white">
  </div>

  <script>
    function openModal(src) {
      document.getElementById('modalImg').src = src;
      document.getElementById('imageModal').classList.remove('hidden');
      document.getElementById('imageModal').classList.add('flex');
    }

    function updateStatusColor(selectEl) {
      const val = selectEl.value;
      selectEl.className = 'text-xs font-semibold px-2.5 py-1 rounded-full border-none outline-none cursor-pointer ';
      if (val === 'Done') selectEl.className += 'bg-emerald-100 text-emerald-800';
      else if (val === 'In Review') selectEl.className += 'bg-sky-100 text-sky-800';
      else if (val === 'Waiting for') selectEl.className += 'bg-rose-100 text-rose-800';
      else selectEl.className += 'bg-slate-200 text-slate-700';
    }
  <\/script>
</body>
</html>`;

      const blob = new Blob([documentHtml], { type: "text/html" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = `qc-report-${new Date().toISOString().slice(0,10)}.html`;
      a.click();
    }
